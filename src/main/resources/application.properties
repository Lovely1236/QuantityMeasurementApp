# Quantity Measurement Application Configuration

# Database Configuration
# Repository type: 'cache' for in-memory cache or 'database' for JDBC-based MySQL repository
app.repository.type=database

# MySQL Database Configuration (Primary Database)
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/quantity_measurement_db
db.username=root
db.password=1234

# Connection Pool Configuration
db.pool.minSize=5
db.pool.maxSize=20
db.pool.connectionTimeoutMs=5000
db.pool.idleTimeoutMs=600000

# Logging Configuration
logging.level=INFO
logging.file=logs/quantitymeasurement.log
